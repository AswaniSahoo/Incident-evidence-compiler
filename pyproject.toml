[build-system]
requires = ["uv_build==0.11.17"]
build-backend = "uv_build"

[project]
name = "incident-evidence-compiler"
version = "0.1.0"
description = "Evidence-grounded incident investigation with a deterministic baseline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "mypy==2.1.0",
  "ruff==0.15.13",
]

[tool.uv]
required-version = "==0.11.17"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]


[[tool.mypy.overrides]]
module = ["test_project_hook", "test_validate_project"]
disable_error_code = ["attr-defined"]
