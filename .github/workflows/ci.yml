name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    # Throwaway PostgreSQL for the integration suite (tests/test_persistence_postgres.py).
    # Same major version and local-only credentials as docker-compose.yml; not a secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iec
          POSTGRES_PASSWORD: iec
          POSTGRES_DB: iec
        ports:
          - 5432:5432
        # -h localhost forces TCP, so the check fails until the real server is up,
        # not the socket-only server the image runs during initialisation.
        options: >-
          --health-cmd "pg_isready -h localhost -U iec -d iec"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.17"
          enable-cache: false

      - name: Install locked environment
        run: uv sync --locked

      - name: Compile source and governance code
        run: uv run --locked python -m compileall -q src scripts .kiro/hooks tests

      # DATABASE_URL enables the PostgreSQL integration tests against the service above.
      # Still skipped on purpose: the live Gemini smoke test (needs a paid GEMINI_API_KEY)
      # and the RE2-OB real-data test (needs the external dataset at IEC_RE2_OB_ROOT).
      - name: Run unit tests
        run: uv run --locked python -m unittest discover -s tests -p "test_*.py" -v
        env:
          DATABASE_URL: postgresql://iec:iec@localhost:5432/iec

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Type check
        run: uv run --locked mypy src tests

      - name: Validate project governance
        run: uv run --locked python scripts/validate_project.py

      - name: Check committed whitespace errors
        run: git show --check --oneline --format=fuller HEAD

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build the container image
        run: docker build -t incident-evidence-compiler:ci .

      - name: Smoke test the running container
        run: |
          docker run -d --name iec-smoke -p 8000:8000 \
            -e IEC_TOKENS=smoke-token=tenant-a \
            incident-evidence-compiler:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then docker logs iec-smoke; docker rm -f iec-smoke; exit 1; fi
          curl -fsS http://127.0.0.1:8000/metrics >/dev/null
          docker rm -f iec-smoke
