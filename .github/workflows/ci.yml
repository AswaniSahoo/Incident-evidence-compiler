name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.17"
          enable-cache: false

      - name: Install locked environment
        run: uv sync --locked

      - name: Compile source and governance code
        run: uv run --locked python -m compileall -q src scripts .kiro/hooks tests

      - name: Run unit tests
        run: uv run --locked python -m unittest discover -s tests -p "test_*.py" -v

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Type check
        run: uv run --locked mypy src tests

      - name: Validate project governance
        run: uv run --locked python scripts/validate_project.py

      - name: Check committed whitespace errors
        run: git show --check --oneline --format=fuller HEAD

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build the container image
        run: docker build -t incident-evidence-compiler:ci .

      - name: Smoke test the running container
        run: |
          docker run -d --name iec-smoke -p 8000:8000 \
            -e IEC_TOKENS=smoke-token=tenant-a \
            incident-evidence-compiler:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then docker logs iec-smoke; docker rm -f iec-smoke; exit 1; fi
          curl -fsS http://127.0.0.1:8000/metrics >/dev/null
          docker rm -f iec-smoke
