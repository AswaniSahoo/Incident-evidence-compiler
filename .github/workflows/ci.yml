name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile governance code
        run: python -m py_compile scripts/validate_project.py .kiro/hooks/project_hook.py tests/test_project_hook.py tests/test_validate_project.py

      - name: Test hook behavior
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate project governance
        run: python scripts/validate_project.py

      - name: Check committed whitespace errors
        run: git show --check --oneline --format=fuller HEAD
