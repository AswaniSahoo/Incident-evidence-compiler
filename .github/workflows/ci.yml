name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.17"
          enable-cache: false

      - name: Install locked environment
        run: uv sync --locked

      - name: Compile source and governance code
        run: uv run --locked python -m compileall -q src scripts .kiro/hooks tests

      - name: Run unit tests
        run: uv run --locked python -m unittest discover -s tests -p "test_*.py" -v

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Type check
        run: uv run --locked mypy src tests

      - name: Validate project governance
        run: uv run --locked python scripts/validate_project.py

      - name: Check committed whitespace errors
        run: git show --check --oneline --format=fuller HEAD
